  # projects
  projects:
    enable: true
    title: "Selected Course Projects"
    navTitle: "Projects"
    items:
      - title: "Rosseland Mean Opacity of Pure Hydrogen Gas"
        date: "Apr 2026"
        content: "Developed a Python framework to compute the Rosseland mean opacity of pure hydrogen gas in LTE,
          and benchmarked it against the Los Alamos TOPS opacity tables. Located the regimes where the two
          disagree most and analyzed the physical channels missing from the calculation that cause the discrepancy."
        image: "/images/projects/benchmark_kR_vs_T_slide.png"
        featured:
          name: "Read Report"
          link: "https://github.com/Zireael-Rhena/Rosseland-Mean-Opacity/blob/main/Rosseland_Mean_Opacity_of_Pure_Hydrogen_Gas.pdf"
        badges:
          - "Opacity"
          - "Radiative Transfer"
        links:
          - icon: "fab fa-github"
            url: "https://github.com/Zireael-Rhena/Rosseland-Mean-Opacity"

      - title: "Lyman-Break Galaxy (LBG) Selection from Photometric Data"
        date: "Jan 2026"
        content: "Developed a LightGBM classifier to identify Lyman-break galaxies at redshift 2–3 from CLAUDS photometry.
          After correcting for selection bias with TSR/SSR metrics, the model reached 0.995 AUC and 92.0% purity,
          outperforming the traditional u-dropout method with a 3.3× larger sample."
        image: "/images/projects/lbg_selection.png"
        featured:
          name: "Read Report"
          link: "https://zireael-rhena.github.io/Target_Selection_Based_on_Photometric_Data/Final_Report_of_Statistical_Methods_in_Astrophysics.pdf"
        badges:
          - "Photometry"
          - "LBGs"
          - "Machine Learning"
        links:
          - icon: "fab fa-github"
            url: "https://github.com/Zireael-Rhena/Target_Selection_Based_on_Photometric_Data"

      - title: "Jiangmen Underground Neutrino Observatory (JUNO) Simulation"
        date: "Aug 2025"
        content: "Built a Python Monte Carlo framework to simulate photon transport, including Fresnel reflection, across 17,612 PMTs.
          Trained a LightGBM model with multi-center Gaussian attention to reconstruct the spatial-temporal probe functions,
          reducing the integral error to ~3%."
        image: "/images/projects/juno.png"
        featured:
          name: "View Source"
          link: "https://github.com/Zireael-Rhena/JUNO-Reconstruction"
        badges:
          - "Simulation"
          - "Monte Carlo"
          - "Machine Learning"
        links:
          - icon: "fab fa-github"
            url: "https://github.com/Zireael-Rhena/JUNO-Reconstruction"

      - title: "Spectrum and Light Curve Analysis of Supernovae"
        date: "Jun 2025"
        content: "Analyzed multi-band photometric and spectroscopic data to classify SN 2025kid as a Type Ia supernova.
          Extracted key parameters (peak magnitude, decline rate Δm15) of SN 2025fvw by light-curve fitting,
          using the Phillips relation for standardization."
        image: "/images/projects/sn_lightcurve.png"
        featured:
          name: "Read Report"
          link: "https://zireael-rhena.github.io/Spectrum-and-Light-Curve-Analysis-of-SN/ObsAstro25_Project2_Final_Report.pdf"
        badges:
          - "Spectroscopy"
          - "Photometry"
          - "Data Analysis"
        links:
          - icon: "fab fa-github"
            url: "https://github.com/Zireael-Rhena/Spectrum-and-Light-Curve-Analysis-of-SN"

