  # Hero
  hero:
    enable: true
    title: "Zisen Dai"
    subtitle: "B.S. in Physics, Tsinghua University"
    content: >
      Hello! I'm Zisen Dai /ˈziː sən daɪ/ (戴子森). I am a senior (4th-year) physics undergraduate at
      <a href="https://www.tsinghua.edu.cn/en/" target="_blank">Tsinghua University</a>
      (Zhili College; Xuetang Talents Program in Physics), working with
      Prof. <a href="https://i.astro.tsinghua.edu.cn/~xbai/" target="_blank">Xue-Ning Bai</a> at Tsinghua and
      Prof. <a href="https://wenbinlu.github.io/" target="_blank">Wenbin Lu</a> at UC Berkeley. <br><br>
      I am drawn to theoretical and computational astrophysics, and am currently most interested in
      accretion, outflows, and particle transport. I enjoy building models to understand how competing
      physical processes play out, and digging into simulation results until I can explain complex
      behavior in clear physical terms. <br><br>
      I am applying to PhD programs in astrophysics for Fall 2027.
    image: /avatar.jpg
