  # Research Experience (layouts/partials/sections/research.html)
  # Optional per item: image (e.g. "/images/research/xxx.png") and imageCaption.
  research:
    enable: true
    title: "Research Experience"
    navTitle: "Research"
    items:
      - title: "Cosmic-ray transport in protoplanetary disk winds"
        institution: "Institute for Advanced Study, Tsinghua University"
        institutionUrl: "https://www.ias.tsinghua.edu.cn/en"
        role: "Research Assistant"
        advisor: "Prof. Xue-Ning Bai"
        advisorUrl: "https://i.astro.tsinghua.edu.cn/~xbai/"
        date: "Mar 2025 – Present"
        location: "Beijing, China"
        content: |-
          Cosmic rays (CRs) are a key ionization source in protoplanetary disks (PPDs), but it is unclear how
          much of the interstellar flux survives the trip through a disk's magnetized wind. I wrote a Python
          particle-transport code from scratch that follows CR protons along a field line of a magneto-thermal
          wind model under the guiding-center approximation, with pitch-angle scattering and cross-field
          diffusion standing in for turbulence. In a laminar wind, CRs lose energy to the outflow. In a
          turbulent one, the flux reaching the disk is largely set by the balance between wind advection and
          turbulent diffusion. In all cases, the wind depletes lower-energy CRs the most.
        outputs:
          - "Paper: **Dai, Z.**, & Bai, X.-N., *Cosmic Ray Transport in Protoplanetary Disk Winds: A Theoretical Framework*, ApJ, in prep."
          - "Contributed talk at The Lin-Bridge Exoplanet Symposium (Jingzhou, Oct 2026), which received the Lin-Bridge Scholarship (First Prize)"

      - title: "Hydrodynamic evolution of micro-TDE disks and their wind emission"
        institution: "Department of Astronomy, UC Berkeley"
        institutionUrl: "https://astro.berkeley.edu/"
        role: "Research Assistant"
        advisor: "Prof. Wenbin Lu"
        advisorUrl: "https://wenbinlu.github.io/"
        date: "May 2026 – Present"
        location: "Berkeley, CA, USA"
        content: |-
          A micro-tidal disruption event (micro-TDE) occurs when a star is torn apart by a stellar-mass
          black hole, leaving an accretion disk around the black hole. Taking this disk as already formed,
          I study how it evolves and what emission its wind produces, using 2D viscous hydrodynamic
          simulations with Athena++.

